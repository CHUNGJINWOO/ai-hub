services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: ai-hub-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - /mnt/data/ai-hub/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ai-hub-net

  api:
    build:
      context: ./api
    container_name: ai-hub-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HF_HOME: /root/.cache/huggingface

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    volumes:
      - /mnt/data/ai-hub/huggingface-cache:/root/.cache/huggingface
      - /mnt/data/ai-hub/documents:/data/documents

    networks:
      - ai-hub-net

  mcp:
    build:
      context: ./api
    container_name: ai-hub-mcp
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HF_HOME: /root/.cache/huggingface
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN}
      MCP_RESOURCE_URL: https://ros2-server.tail49948f.ts.net:10000/mcp
      KEYCLOAK_ISSUER: https://ros2-server.tail49948f.ts.net:8443/realms/ai-hub
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/ai-hub/protocol/openid-connect/certs

    ports:
      - "127.0.0.1:8001:8001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    volumes:
      - /mnt/data/ai-hub/huggingface-cache:/root/.cache/huggingface
      - /mnt/data/ai-hub/documents:/data/documents

    command:
      [
        "uvicorn",
        "app.mcp_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001"
      ]

    networks:
      - ai-hub-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: ai-hub-keycloak
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: "http"

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aihub
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HOSTNAME: "https://ros2-server.tail49948f.ts.net:8443"
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"

    ports:
      - "127.0.0.1:8081:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    command: start-dev --features=cimd

    networks:
      - ai-hub-net

networks:
  ai-hub-net:
    driver: bridge
