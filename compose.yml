services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: ai-hub-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - /mnt/data/ai-hub/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ai-hub-net

  api:
    build:
      context: ./api
    container_name: ai-hub-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - ai-hub-net

networks:
  ai-hub-net:
    driver: bridge
